name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    # macos-26 is the GA image. As of image 20260907.0351.1 its default /Applications/Xcode.app
    # is Xcode 26.6 with the macOS 26.5 SDK, which supports the Swift 6 /
    # SWIFT_DEFAULT_ACTOR_ISOLATION build settings (Swift 6.2+). Local builds and release DMGs use
    # Xcode 27, which GitHub offers only on the preview `xcode-27` label. macos-14 is deprecated
    # and its toolchain tops out at Swift 5 ("SWIFT_VERSION '6.0' is unsupported").
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun swift --version
          xcrun --sdk macosx --show-sdk-version

      - name: Build (Debug, unsigned)
        run: |
          xcodebuild -project Hashlight.xcodeproj -scheme Hashlight -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Test (Debug, unsigned)
        run: |
          xcodebuild -project Hashlight.xcodeproj -scheme Hashlight -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            test -destination 'platform=macOS'
